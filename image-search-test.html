<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lens接続テスト</title><style>body{font-family:system-ui;margin:0;background:#f3f0e9;color:#28251f}.w{max-width:760px;margin:auto;padding:18px}.c{background:#fffdf8;border:1px solid #d9d1c3;border-radius:18px;padding:16px;margin:12px 0}input,button{width:100%;padding:13px;font-size:16px;border-radius:12px;border:1px solid #d9d1c3}button{background:#b55332;color:white;border:0;font-weight:800;margin-top:10px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:560px){.g{grid-template-columns:1fr}}.item{border:1px solid #d9d1c3;border-radius:14px;overflow:hidden;background:white}.item img{width:100%;height:180px;object-fit:contain;background:#eee}.p{padding:10px}.status{white-space:pre-wrap;background:#ebe6db;padding:10px;border-radius:10px;margin-top:10px}</style></head><body><div class="w"><div class="c"><h2>Google Lens API 接続テスト</h2><p>商品写真を選んで検索します。500KBを超える写真はブラウザ内でJPEG圧縮します。</p><input id="f" type="file" accept="image/*" capture="environment"><button id="b">類似商品を検索</button><div id="s" class="status">待機中</div></div><div id="r" class="g"></div></div><script>
const WORKER='https://sekastock-image-search.masato369567.workers.dev/';
const $=x=>document.getElementById(x);async function compress(file){if(file.size<=480000)return file;let img=await new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});let scale=Math.min(1,1200/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.75,blob;do{blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',q));q-=.1}while(blob&&blob.size>480000&&q>.25);return new File([blob], 'product.jpg',{type:'image/jpeg'})}
$('b').onclick=async()=>{let file=$('f').files[0];if(!file)return alert('写真を選択してください');$('b').disabled=true;$('s').textContent='画像を準備中…';$('r').innerHTML='';try{file=await compress(file);$('s').textContent=`送信中… ${Math.round(file.size/1024)}KB`;let fd=new FormData();fd.append('image',file,file.name);let res=await fetch(WORKER,{method:'POST',body:fd});let data=await res.json();if(!res.ok||!data.ok)throw new Error(JSON.stringify(data,null,2));$('s').textContent=`成功：${data.count}件の候補を取得`;for(const m of data.matches||[]){let d=document.createElement('div');d.className='item';let im=m.thumbnail||m.image||'';d.innerHTML=`${im?`<img src="${im}" alt="候補画像">`:''}<div class="p"><b>${m.title||'タイトルなし'}</b><p>${m.source||''}</p>${m.price?`<p>表示価格: ${typeof m.price==='object'?JSON.stringify(m.price):m.price}</p>`:''}${m.link?`<a href="${m.link}" target="_blank" rel="noopener">元ページを開く</a>`:''}</div>`;$('r').appendChild(d)}}catch(e){$('s').textContent='エラー\n'+e.message}finally{$('b').disabled=false}};
</script></body></html>
