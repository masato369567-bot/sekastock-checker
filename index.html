<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365d"><link rel="manifest" href="manifest.json"><title>仕入れ判定カメラ v3</title><style>
:root{--n:#17365d;--b:#2673b8;--bg:#f4f7fa;--g:#138a4a;--a:#b36b00;--r:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:var(--bg);color:#17202a}header{background:var(--n);color:#fff;padding:15px;position:sticky;top:0;z-index:3}header h1{margin:0;font-size:20px}.wrap{max-width:860px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 12px #17365d18}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:800;font-size:13px;margin:5px 0}input,select,button,textarea{width:100%;padding:11px;border:1px solid #bcc8d4;border-radius:9px;font-size:16px}button{background:var(--b);color:#fff;border:0;font-weight:800;margin-top:7px;cursor:pointer}.secondary{background:#53677a}.danger{background:#9b2c2c}.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mode button{min-height:54px}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.preview img{width:100%;height:110px;object-fit:cover;border:1px solid #ccd6df;border-radius:8px}.status{margin-top:8px;padding:10px;background:#edf5fc;border-left:5px solid var(--b);white-space:pre-wrap}.warn{background:#fff4de;border-left-color:var(--a)}.prices{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.priceRow{display:flex;align-items:center;gap:7px;background:#f5f7f9;padding:7px;border-radius:9px}.priceRow input[type=checkbox]{width:24px}.priceRow input[type=number]{flex:1}.outlier{background:#fff0e1}.big{font-size:30px;font-weight:900}.limit{font-size:42px;font-weight:950;color:var(--n);text-align:center;padding:14px;background:#eaf2fa;border:3px solid var(--b);border-radius:14px}.buy{color:var(--g)}.hold{color:var(--a)}.stop{color:var(--r)}.badge,.candidate{display:inline-block;background:#e6eef6;padding:7px 10px;border-radius:999px;font-weight:800;margin:3px;cursor:pointer}.candidate:hover{background:#cfe3f4}.hint{font-size:12px;color:#536274}.raw{font-size:12px;max-height:140px;overflow:auto;background:#f6f7f8;padding:8px;border-radius:7px;white-space:pre-wrap}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><header><h1>仕入れ判定カメラ v3</h1><small>専用OCR・候補選択・外れ値判定・仕入上限</small></header><main class="wrap">
<section class="card"><h2>1. 専用モードで撮影</h2><div class="mode"><button data-mode="tag">ブランドタグ</button><button data-mode="model">型番・品番</button><button data-mode="price">値札</button></div><input id="productFile" type="file" accept="image/*" capture="environment" style="margin-top:9px"><div id="pPrev" class="preview"></div><div id="modeInfo" class="status">上の撮影モードを選び、写真を撮ってください。</div><button id="runOcr">選択モードでOCR</button><div id="candidates"></div><details><summary>OCR全文</summary><div id="raw" class="raw"></div></details></section>
<section class="card"><h2>2. 商品情報</h2><div class="grid"><div><label>区分</label><select id="category"><option>服</option><option>ゲーム</option><option>カメラ</option><option>オーディオ</option><option>楽器</option><option>工具</option><option>ホビー</option><option>その他</option></select></div><div><label>状態</label><select id="condition"><option value="0">動作品・中古良好</option><option value="500">傷・使用感あり</option><option value="1000">動作未確認</option><option value="2000">欠品あり</option><option value="0.4">ジャンク</option></select></div><div><label>ブランド / メーカー</label><input id="brand"></div><div><label>商品名</label><input id="name"></div><div><label>型番・品番</label><input id="model"></div><div><label>店頭価格</label><input id="cost" type="number" inputmode="numeric"></div><div><label>比較方法</label><select id="match"><option value="1">A 同型・同品番 100%</option><option value="0.85">B 近似型 85%</option><option value="0.7">C 参考品 70%</option></select></div><div><label>送料</label><input id="shipping" type="number" value="750"></div></div></section>
<section class="card"><h2>3. 売り切れ相場</h2><input id="marketFiles" type="file" accept="image/*" multiple><button id="marketOcr">スクショから価格候補を抽出</button><div id="mStatus" class="status">価格候補を抽出後、「使用する価格」だけチェックします。</div><div id="prices" class="prices"></div><button class="secondary" id="addPrice">価格欄を追加</button></section>
<section class="card"><h2>4. 判定</h2><div id="limit" class="limit">仕入上限 0円</div><div id="result"></div><button id="save">端末に保存</button></section>
<section class="card"><h2>履歴</h2><button class="secondary" id="csv">CSV出力</button><div style="overflow:auto"><table><thead><tr><th>日時</th><th>商品</th><th>仕入</th><th>利益</th><th>判定</th></tr></thead><tbody id="hist"></tbody></table></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=x=>document.getElementById(x),yen=n=>Math.round(n||0).toLocaleString('ja-JP')+'円';let mode='tag';
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.style.outline='');b.style.outline='4px solid #8fc5ef';$('modeInfo').textContent={tag:'ブランドタグを画面いっぱいに撮影します。',model:'型番・品番ラベルを正面から撮影します。',price:'値札の価格部分を大きく撮影します。'}[mode]});document.querySelector('[data-mode=tag]').click();
$('productFile').onchange=e=>{let f=e.target.files[0];$('pPrev').innerHTML='';if(f){let i=new Image;i.src=URL.createObjectURL(f);$('pPrev').appendChild(i)}};
async function ocr(files,status){let out=[];for(let [i,f] of [...files].entries()){let r=await Tesseract.recognize(f,'jpn+eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`OCR中 ${i+1}/${files.length} ${Math.round(m.progress*100)}%`}});out.push(r.data.text)}return out.join('\n')}
const brands=['Carhartt','Dickies','Polo Ralph Lauren','Ralph Lauren','adidas','NIKE','Levi’s','Levis','Levi\'s','Champion','Patagonia','THE NORTH FACE','L.L.Bean','Columbia','Harley-Davidson','Canon','SONY','Nikon','Panasonic','CASIO','FUJIFILM','OLYMPUS','PENTAX','Nintendo','BOSS','Roland','YAMAHA','KORG','Makita','HiKOKI','BOSCH','BOSE','JBL','DENON','ONKYO','Technics'];
function uniq(a){return [...new Set(a.filter(Boolean))].slice(0,6)}function variants(s){let a=[s,s.replaceAll('O','0'),s.replaceAll('0','O'),s.replaceAll('I','1'),s.replaceAll('1','I'),s.replaceAll('S','5')];return uniq(a)}
$('runOcr').onclick=async()=>{let fs=$('productFile').files;if(!fs.length)return alert('写真を選んでください');let t=await ocr(fs,$('modeInfo'));$('raw').textContent=t;$('candidates').innerHTML='';let c=[];if(mode==='tag'){c=brands.filter(b=>new RegExp(b.replace('.','\\.'),'i').test(t));}if(mode==='model'){let m=t.toUpperCase().match(/[A-Z]{1,8}[\s_-]?[A-Z0-9]{2,15}(?:[\s_-][A-Z0-9]{1,10})?/g)||[];c=uniq(m.filter(x=>!/MADE|SIZE|COLOR|PRICE|JAPAN|CHINA/.test(x)).flatMap(variants));}if(mode==='price'){c=uniq([...t.matchAll(/(?:¥|￥)?\s*([1-9][0-9,]{2,6})\s*(?:円|税込)?/g)].map(m=>m[1].replaceAll(',','')));}if(!c.length){$('modeInfo').textContent='候補を抽出できませんでした。撮り直すか手入力してください。';return}$('modeInfo').textContent='候補をタップして採用してください。';c.forEach(v=>{let s=document.createElement('span');s.className='candidate';s.textContent=v;s.onclick=()=>{if(mode==='tag')$('brand').value=v;if(mode==='model')$('model').value=v;if(mode==='price')$('cost').value=+v;calc()};$('candidates').appendChild(s)})};
function addPrice(v='',checked=true){let d=document.createElement('div');d.className='priceRow';d.innerHTML=`<input type="checkbox" ${checked?'checked':''}><input type="number" placeholder="成約価格" value="${v}"><span></span>`;d.querySelectorAll('input').forEach(x=>x.oninput=calc);$('prices').appendChild(d)}for(let i=0;i<5;i++)addPrice('',false);$('addPrice').onclick=()=>addPrice('',true);
$('marketOcr').onclick=async()=>{let fs=$('marketFiles').files;if(!fs.length)return alert('スクショを選んでください');let t=await ocr(fs,$('mStatus'));let p=uniq([...t.matchAll(/(?:¥|￥)?\s*([1-9][0-9,]{2,6})\s*円?/g)].map(m=>+m[1].replaceAll(',','')).filter(n=>n>=300&&n<=500000));$('prices').innerHTML='';(p.length?p:['','','','','']).forEach(v=>addPrice(v,!!v));$('mStatus').textContent=p.length?`${p.length}件抽出。外れ値候補を確認してください。`:'抽出できません。手入力してください。';calc()};
function allRows(){return [...document.querySelectorAll('.priceRow')]}function median(a){a=[...a].sort((x,y)=>x-y);let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}function quartile(a,q){a=[...a].sort((x,y)=>x-y);let p=(a.length-1)*q,b=Math.floor(p),r=p-b;return a[b]+((a[b+1]??a[b])-a[b])*r}
function markOutliers(){let rows=allRows(),all=rows.map(r=>+r.querySelector('input[type=number]').value).filter(Boolean);if(all.length<4){rows.forEach(r=>{r.classList.remove('outlier');r.querySelector('span').textContent=''});return}let q1=quartile(all,.25),q3=quartile(all,.75),iqr=q3-q1,lo=q1-1.5*iqr,hi=q3+1.5*iqr;rows.forEach(r=>{let n=+r.querySelector('input[type=number]').value,o=n&&(n<lo||n>hi);r.classList.toggle('outlier',o);r.querySelector('span').textContent=o?'外れ値候補':''})}
function calc(){markOutliers();let rows=allRows(),p=rows.filter(r=>r.querySelector('input[type=checkbox]').checked).map(r=>+r.querySelector('input[type=number]').value).filter(Boolean),med=p.length?median(p):0,w=+$('match').value,cost=+$('cost').value||0,ship=+$('shipping').value||0,safe=med*w*.9,fee=safe*.1,r=$('condition').value,risk=r==='0.4'?safe*.4:+r,profit=safe-fee-ship-risk-cost,margin=safe?profit/safe:0,limit=Math.max(0,safe-fee-ship-risk-2000),machine=$('category').value!=='服';let label=(profit>=2000&&margin>=.25&&p.length>=3)?'仕入れ候補':(profit>=1000&&p.length>=2)?'要確認':'見送り';if(machine&&w<1)label='要確認';let cls=label==='仕入れ候補'?'buy':label==='要確認'?'hold':'stop';$('limit').textContent='仕入上限 '+yen(limit);$('result').innerHTML=`<div class="big ${cls}">${label}</div><span class="badge">使用価格 ${p.length}件</span><span class="badge">中央値 ${yen(med)}</span><p>安全補正後 <b>${yen(safe)}</b><br>店頭価格 ${yen(cost)} / 手数料 ${yen(fee)} / 送料 ${yen(ship)} / リスク ${yen(risk)}</p><p>想定利益 <b class="${cls}">${yen(profit)}</b><br>利益率 <b>${(margin*100).toFixed(1)}%</b></p>${p.length<3?'<div class="status warn">比較価格は3件以上を推奨します。</div>':''}${machine&&w<1?'<div class="status warn">機械の類似型は参考値です。同型を優先してください。</div>':''}`;return{profit,label}}
['category','condition','match','cost','shipping'].forEach(x=>$(x).oninput=calc);const KEY='sourcingV3';function hist(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function render(){$('hist').innerHTML=hist().map(x=>`<tr><td>${x.date}</td><td>${x.brand} ${x.name}<br>${x.model}</td><td>${yen(x.cost)}</td><td>${yen(x.profit)}</td><td>${x.label}</td></tr>`).join('')}$('save').onclick=()=>{let r=calc(),d=hist();d.unshift({date:new Date().toLocaleString('ja-JP'),brand:$('brand').value,name:$('name').value,model:$('model').value,cost:+$('cost').value,profit:r.profit,label:r.label});localStorage.setItem(KEY,JSON.stringify(d));render();alert('保存しました')};$('csv').onclick=()=>{let d=hist(),rows=[['日時','ブランド','商品名','型番','仕入額','想定利益','判定'],...d.map(x=>[x.date,x.brand,x.name,x.model,x.cost,Math.round(x.profit),x.label])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='仕入れ判定履歴_v3.csv';a.click()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();calc();
</script></body></html>
