<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json"><title>仕入れ判定 v4</title><style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--blue:#2563eb;--green:#128a4b;--yellow:#ca7500;--red:#c52b24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;padding-bottom:78px}header{background:#0b1220;color:#fff;padding:18px 16px}header h1{font-size:20px;margin:0}.wrap{max-width:780px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #1018280d}h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}label{font-size:12px;font-weight:800;color:#475467;display:block;margin:2px 0 5px}input,select,button{width:100%;border:1px solid #d0d5dd;border-radius:11px;padding:12px;font-size:16px;background:#fff}button{border:0;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}.sub{background:#475467}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.modes button{min-height:58px}.active{outline:3px solid #93c5fd}.preview img{max-width:100%;height:150px;object-fit:cover;border-radius:12px;margin-top:10px}.status{background:#eff6ff;border-left:4px solid var(--blue);border-radius:8px;padding:10px;font-size:13px;margin-top:10px;white-space:pre-wrap}.candidate{display:inline-block;padding:8px 11px;margin:4px;background:#eef2f6;border-radius:999px;font-weight:800;cursor:pointer}.priceRow{display:grid;grid-template-columns:30px 1fr 90px;gap:8px;align-items:center;padding:7px;border-radius:10px;background:#f8fafc;margin:6px 0}.priceRow input[type=checkbox]{width:22px;height:22px}.outlier{background:#fff1e6}.outlier span{color:var(--yellow);font-weight:800}.decision{text-align:center;border-radius:20px;padding:20px;margin-top:10px}.decision.buy{background:#e9f9ef;color:#096c38}.decision.hold{background:#fff6df;color:#8a5500}.decision.stop{background:#fff0ef;color:#a51f1a}.decision .label{font-size:25px;font-weight:950}.limitBox{text-align:center;background:#0b1220;color:#fff;border-radius:20px;padding:20px;margin:12px 0}.limitBox small{display:block;color:#cbd5e1;font-weight:800}.limitBox strong{display:block;font-size:46px;line-height:1.1;margin:6px 0}.delta{font-weight:900;font-size:18px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#f8fafc;border-radius:12px;padding:12px}.metric span{display:block;font-size:12px;color:var(--muted)}.metric b{font-size:18px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:4}.bottom div{max-width:780px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.bottom button{background:#fff;color:#344054;border-radius:0;padding:13px 4px;font-size:13px}.bottom button:hover{background:#f2f4f7}.historyItem{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.hint{font-size:12px;color:var(--muted)}details{margin-top:8px}</style></head><body><header><h1>仕入れ判定</h1><small>安全側の仕入上限を最優先</small></header><main class="wrap">
<section class="card" id="check"><h2>1. 商品情報を読む</h2><div class="modes"><button data-mode="tag">タグ</button><button data-mode="model">型番・品番</button><button data-mode="price">値札</button></div><input id="photo" type="file" accept="image/*" capture="environment" style="margin-top:10px"><div id="preview" class="preview"></div><button id="ocr">この写真をOCR</button><div id="ocrStatus" class="status">モードを選び、写真を撮影してください。</div><div id="candidates"></div><details><summary>OCR全文</summary><pre id="raw"></pre></details><div class="grid" style="margin-top:12px"><div><label>区分</label><select id="category"><option>服</option><option>ゲーム</option><option>カメラ</option><option>オーディオ</option><option>楽器</option><option>工具</option><option>ホビー</option><option>その他</option></select></div><div><label>ブランド / メーカー</label><input id="brand"></div><div><label>商品名</label><input id="name"></div><div><label>型番・品番</label><input id="model"></div><div><label>店頭価格</label><input id="cost" type="number" inputmode="numeric"></div><div><label>状態</label><select id="condition"><option value="0">良好・動作品</option><option value="500">傷・使用感あり</option><option value="1000">動作未確認</option><option value="2000">欠品あり</option><option value="0.4">ジャンク</option></select></div></div></section>
<section class="card"><h2>2. 売り切れ相場</h2><div class="grid"><div><label>比較方法</label><select id="match"><option value="1">A 同型・同品番</option><option value="0.85">B 近似型</option><option value="0.7">C 参考品</option></select></div><div><label>送料</label><input id="shipping" type="number" value="750"></div></div><label style="margin-top:12px">売り切れスクショ</label><input id="market" type="file" accept="image/*" multiple><button id="marketOcr">スクショから価格を抽出</button><div id="mStatus" class="status">3件以上の比較を推奨。使う価格だけチェックしてください。</div><div id="prices"></div><button id="addPrice" class="sub">価格を手入力で追加</button></section>
<section class="card" id="judge"><h2>3. 仕入れ判定</h2><div id="decision" class="decision stop"><div class="label">見送り</div></div><div class="limitBox"><small>目標利益を確保する仕入上限</small><strong id="limit">0円</strong><div id="delta" class="delta">店頭価格を入力してください</div></div><div class="metrics"><div class="metric"><span>安全側想定売価</span><b id="safe">0円</b></div><div class="metric"><span>想定利益</span><b id="profit">0円</b></div><div class="metric"><span>相場中央値</span><b id="median">0円</b></div><div class="metric"><span>利益率</span><b id="margin">0.0%</b></div></div><div id="warnings"></div><div class="grid" style="margin-top:10px"><button id="buyBtn">仕入れる</button><button id="passBtn" class="sub">見送る</button></div></section>
<section class="card" id="history"><h2>判定履歴</h2><div id="historyList"></div><button id="csv" class="sub">CSV出力</button></section>
<section class="card" id="settings"><h2>設定</h2><div class="settings"><div><label>目標利益</label><input id="targetProfit" type="number" value="2000"></div><div><label>最低利益率</label><input id="minMargin" type="number" value="25"></div><div><label>安全率（%）</label><input id="safety" type="number" value="90"></div><div><label>販売手数料（%）</label><input id="feeRate" type="number" value="10"></div></div><p class="hint">仕入上限 = 安全側想定売価 − 手数料 − 送料 − リスク引当 − 目標利益。利益を保証する価格ではありません。</p></section>
</main><nav class="bottom"><div><button onclick="go('check')">撮影・入力</button><button onclick="go('judge')">判定</button><button onclick="go('settings')">設定</button></div></nav><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id),yen=n=>Math.round(n||0).toLocaleString('ja-JP')+'円';function go(id){$(id).scrollIntoView({behavior:'smooth'})}let mode='tag';document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('ocrStatus').textContent={tag:'ブランドタグを画面いっぱいに撮影してください。',model:'型番・品番を正面から大きく撮影してください。',price:'値札の価格部分を大きく撮影してください。'}[mode]});document.querySelector('[data-mode=tag]').click();$('photo').onchange=e=>{let f=e.target.files[0];$('preview').innerHTML='';if(f){let im=new Image;im.src=URL.createObjectURL(f);$('preview').appendChild(im)}};
async function ocrFiles(files,status){let t=[];for(let [i,f] of [...files].entries()){let r=await Tesseract.recognize(f,'jpn+eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`OCR中 ${i+1}/${files.length} ${Math.round(m.progress*100)}%`}});t.push(r.data.text)}return t.join('\n')}const brands=['Carhartt','Dickies','Polo Ralph Lauren','Ralph Lauren','adidas','NIKE','Levi\'s','Champion','Patagonia','THE NORTH FACE','L.L.Bean','Columbia','Harley-Davidson','Canon','SONY','Nikon','Panasonic','CASIO','FUJIFILM','OLYMPUS','PENTAX','Nintendo','BOSS','Roland','YAMAHA','KORG','Makita','HiKOKI','BOSCH','BOSE','JBL','DENON','ONKYO','Technics'];function uq(a){return[...new Set(a.filter(Boolean))].slice(0,8)}
$('ocr').onclick=async()=>{let fs=$('photo').files;if(!fs.length)return alert('写真を撮影してください');let t=await ocrFiles(fs,$('ocrStatus'));$('raw').textContent=t;$('candidates').innerHTML='';let c=[];if(mode==='tag')c=brands.filter(b=>new RegExp(b.replace('.','\\.'),'i').test(t));if(mode==='model'){let m=t.toUpperCase().match(/[A-Z]{1,8}[\s_-]?[A-Z0-9]{2,15}(?:[\s_-][A-Z0-9]{1,10})?/g)||[];c=uq(m.filter(x=>!/MADE|SIZE|COLOR|PRICE|JAPAN|CHINA/.test(x)).flatMap(x=>[x,x.replaceAll('O','0'),x.replaceAll('0','O'),x.replaceAll('I','1'),x.replaceAll('1','I')]))}if(mode==='price')c=uq([...t.matchAll(/(?:¥|￥)?\s*([1-9][0-9,]{2,6})\s*(?:円|税込)?/g)].map(m=>m[1].replaceAll(',','')));if(!c.length){$('ocrStatus').textContent='候補なし。撮り直すか手入力してください。';return}c.forEach(v=>{let s=document.createElement('span');s.className='candidate';s.textContent=v;s.onclick=()=>{if(mode==='tag')$('brand').value=v;if(mode==='model')$('model').value=v;if(mode==='price')$('cost').value=+v;calc()};$('candidates').appendChild(s)});$('ocrStatus').textContent='候補をタップして採用してください。'};
function addPrice(v='',checked=true){let d=document.createElement('div');d.className='priceRow';d.innerHTML=`<input type="checkbox" ${checked?'checked':''}><input type="number" value="${v}" placeholder="成約価格"><span></span>`;d.querySelectorAll('input').forEach(x=>x.oninput=calc);$('prices').appendChild(d)}for(let i=0;i<5;i++)addPrice('',false);$('addPrice').onclick=()=>addPrice('',true);$('marketOcr').onclick=async()=>{let fs=$('market').files;if(!fs.length)return alert('売り切れスクショを選択してください');let t=await ocrFiles(fs,$('mStatus'));let p=uq([...t.matchAll(/(?:¥|￥)?\s*([1-9][0-9,]{2,6})\s*円?/g)].map(m=>+m[1].replaceAll(',','')).filter(n=>n>=300&&n<=500000));$('prices').innerHTML='';(p.length?p:['','','','','']).forEach(v=>addPrice(v,!!v));$('mStatus').textContent=p.length?`${p.length}件の価格候補。比較対象だけ残してください。`:'抽出できません。手入力してください。';calc()};function median(a){a=[...a].sort((x,y)=>x-y);let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}function qt(a,q){a=[...a].sort((x,y)=>x-y);let p=(a.length-1)*q,b=Math.floor(p);return a[b]+((a[b+1]??a[b])-a[b])*(p-b)}function markOutliers(){let rs=[...document.querySelectorAll('.priceRow')],a=rs.map(r=>+r.querySelector('input[type=number]').value).filter(Boolean);if(a.length<4)return rs.forEach(r=>{r.classList.remove('outlier');r.querySelector('span').textContent='' });let q1=qt(a,.25),q3=qt(a,.75),iqr=q3-q1;rs.forEach(r=>{let n=+r.querySelector('input[type=number]').value,o=n&&(n<q1-1.5*iqr||n>q3+1.5*iqr);r.classList.toggle('outlier',o);r.querySelector('span').textContent=o?'要確認':''})}
let last={};function calc(){markOutliers();let p=[...document.querySelectorAll('.priceRow')].filter(r=>r.querySelector('input[type=checkbox]').checked).map(r=>+r.querySelector('input[type=number]').value).filter(Boolean),med=p.length?median(p):0,w=+$('match').value,safety=(+$('safety').value||90)/100,safe=med*w*safety,fee=safe*((+$('feeRate').value||10)/100),ship=+$('shipping').value||0,cost=+$('cost').value||0,r=$('condition').value,risk=r==='0.4'?safe*.4:+r,target=+$('targetProfit').value||0,minM=(+$('minMargin').value||25)/100,profit=safe-fee-ship-risk-cost,margin=safe?profit/safe:0,limit=Math.max(0,safe-fee-ship-risk-target),delta=limit-cost,machine=$('category').value!=='服';let ok=profit>=target&&margin>=minM&&p.length>=3,label=ok?'仕入れ候補':profit>0?'要確認':'見送り';if(machine&&w<1)label='要確認';let cls=label==='仕入れ候補'?'buy':label==='要確認'?'hold':'stop';$('decision').className='decision '+cls;$('decision').innerHTML=`<div class="label">${label}</div>`;$('limit').textContent=yen(limit);$('delta').textContent=cost?`店頭価格 ${yen(cost)} / 上限との差 ${delta>=0?'+':''}${yen(delta)}`:'店頭価格を入力してください';$('safe').textContent=yen(safe);$('profit').textContent=yen(profit);$('median').textContent=yen(med);$('margin').textContent=(margin*100).toFixed(1)+'%';let warnings=[];if(p.length<3)warnings.push('比較価格が3件未満です');if(machine&&w<1)warnings.push('機械は類似型ではなく同型相場を優先');if(r==='1000')warnings.push('動作未確認のリスク引当を適用');$('warnings').innerHTML=warnings.map(x=>`<div class="status">${x}</div>`).join('');last={profit,label,limit,med,safe,margin};return last}['category','condition','match','shipping','cost','targetProfit','minMargin','safety','feeRate'].forEach(id=>$(id).oninput=calc);
const KEY='sourcingV4';function data(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function render(){let d=data();$('historyList').innerHTML=d.length?d.slice(0,30).map(x=>`<div class="historyItem"><div><b>${x.brand||''} ${x.name||'商品'}</b><br><small>${x.model||''} / ${x.action}</small></div><div><b>${yen(x.limit)}</b><br><small>上限</small></div></div>`).join(''):'<p class="hint">まだ判定履歴がありません。</p>'}function store(action){let r=calc(),d=data();d.unshift({date:new Date().toLocaleString('ja-JP'),brand:$('brand').value,name:$('name').value,model:$('model').value,cost:+$('cost').value,profit:r.profit,limit:r.limit,label:r.label,action});localStorage.setItem(KEY,JSON.stringify(d.slice(0,300)));render();alert(action+'として保存しました')}$('buyBtn').onclick=()=>store('仕入れる');$('passBtn').onclick=()=>store('見送る');$('csv').onclick=()=>{let d=data(),rows=[['日時','ブランド','商品名','型番','仕入額','仕入上限','想定利益','判定','判断'],...d.map(x=>[x.date,x.brand,x.name,x.model,x.cost,Math.round(x.limit),Math.round(x.profit),x.label,x.action])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='仕入れ判定履歴_v4.csv';a.click()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();calc();
</script></body></html>
