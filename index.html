<!doctype html><html lang="ja" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#28251f"><link rel="manifest" href="manifest.json"><title>仕入れ判定 V5</title><style>
:root{--bg:#f3f0e9;--surface:#fffdf8;--surface2:#ebe6db;--ink:#28251f;--muted:#716b60;--line:#d9d1c3;--accent:#b55332;--accent2:#6e7b55;--good:#447454;--warn:#aa7428;--bad:#a3473f;--shadow:0 10px 30px #3b332718}html[data-theme="dark"]{--bg:#171713;--surface:#22211c;--surface2:#2e2c25;--ink:#f3efe5;--muted:#aaa396;--line:#434036;--accent:#e07b54;--accent2:#9cab78;--good:#74ad84;--warn:#d5a14e;--bad:#d8756c;--shadow:0 10px 35px #0006}@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#171713;--surface:#22211c;--surface2:#2e2c25;--ink:#f3efe5;--muted:#aaa396;--line:#434036;--accent:#e07b54;--accent2:#9cab78;--good:#74ad84;--warn:#d5a14e;--bad:#d8756c;--shadow:0 10px 35px #0006}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,"Noto Sans JP",sans-serif;padding-bottom:78px;transition:.2s}header{padding:20px 18px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.head{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brandMark{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--accent),#db9b65);display:grid;place-items:center;color:#fff;font-weight:950}.title h1{font-size:19px;margin:0}.title small{color:var(--muted)}.themeBtn{width:auto;padding:9px 12px;background:var(--surface2);color:var(--ink)}.wrap{max-width:820px;margin:auto;padding:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:17px;margin:12px 0;box-shadow:var(--shadow)}.sectionTitle{display:flex;align-items:center;gap:10px;margin-bottom:14px}.step{width:29px;height:29px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900}.sectionTitle h2{font-size:17px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}}label{display:block;font-size:12px;font-weight:850;color:var(--muted);margin:3px 0 5px}input,select,button{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;font-size:16px;background:var(--surface);color:var(--ink)}button{border:0;background:var(--accent);color:#fff;font-weight:850;cursor:pointer}.secondary{background:var(--surface2);color:var(--ink)}.olive{background:var(--accent2);color:#fff}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.modes button{background:var(--surface2);color:var(--ink);padding:11px 5px;font-size:13px}.modes button.active{background:var(--accent);color:#fff}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.preview img{width:100%;height:130px;object-fit:cover;border-radius:14px;margin-top:9px}.status{padding:11px;margin-top:9px;background:var(--surface2);border-left:4px solid var(--accent2);border-radius:9px;font-size:13px;white-space:pre-wrap}.candidate{display:inline-block;padding:8px 11px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;margin:4px;font-weight:800;cursor:pointer}.searchBox{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 15%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:17px;padding:14px;margin-top:12px}.query{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.query:last-child{border:0}.query code{flex:1;color:var(--ink);white-space:normal}.query button{width:auto;padding:8px 11px}.priceRow{display:grid;grid-template-columns:30px 1fr 86px;gap:8px;align-items:center;background:var(--surface2);padding:7px;border-radius:12px;margin:6px 0}.priceRow input[type=checkbox]{width:22px;height:22px}.outlier{outline:2px solid var(--warn)}.outlier span{color:var(--warn);font-weight:850}.decision{text-align:center;border-radius:20px;padding:18px}.buy{background:color-mix(in srgb,var(--good) 17%,var(--surface));color:var(--good)}.hold{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}.stop{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}.decision strong{font-size:27px}.limit{background:var(--ink);color:var(--bg);border-radius:22px;text-align:center;padding:20px;margin:12px 0}.limit span{font-size:12px;font-weight:800;opacity:.8}.limit b{display:block;font-size:46px;line-height:1.15;margin:5px}.limit small{font-size:15px;font-weight:850}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:var(--surface2);padding:12px;border-radius:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{font-size:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.hint{font-size:12px;color:var(--muted)}details pre{white-space:pre-wrap;max-height:150px;overflow:auto;font-size:11px}.bottom{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:8}.bottom div{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.bottom button{background:transparent;color:var(--muted);font-size:12px;border-radius:0;padding:14px 4px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:850;margin:2px}.history{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}</style></head><body><header><div class="head"><div class="brandMark"><div class="logo">S</div><div class="title"><h1>仕入れ判定</h1><small>V5 Visual Market Check</small></div></div><button id="theme" class="themeBtn">◐ Auto</button></div></header><main class="wrap">
<section class="card" id="scan"><div class="sectionTitle"><div class="step">1</div><h2>商品を読み取る</h2></div><div class="modes"><button data-mode="whole">商品全体</button><button data-mode="tag">タグ</button><button data-mode="model">型番</button><button data-mode="price">値札</button></div><input id="photo" type="file" accept="image/*" capture="environment" style="margin-top:10px"><div id="preview" class="preview"></div><button id="ocr" class="olive">写真を解析</button><div id="ocrStatus" class="status">商品全体、タグ、型番、値札を順番に撮影できます。</div><div id="candidates"></div><details><summary>OCR全文</summary><pre id="raw"></pre></details><div class="grid" style="margin-top:12px"><div><label>区分</label><select id="category"><option>服</option><option>ゲーム</option><option>カメラ</option><option>オーディオ</option><option>楽器</option><option>工具</option><option>ホビー</option><option>その他</option></select></div><div><label>ブランド / メーカー</label><input id="brand"></div><div><label>商品名</label><input id="name"></div><div><label>型番・品番</label><input id="model"></div><div><label>店頭価格</label><input id="cost" type="number" inputmode="numeric"></div><div><label>状態</label><select id="condition"><option value="0">良好・動作品</option><option value="500">傷・使用感あり</option><option value="1000">動作未確認</option><option value="2000">欠品あり</option><option value="0.4">ジャンク</option></select></div></div><div class="searchBox"><b>検索候補</b><p class="hint">画像認識の代わりに、OCR情報から類似商品検索ワードを自動生成します。</p><div id="queries"></div><div class="actions"><button id="mercari" class="olive">メルカリ画像検索を開く</button><button id="lens" class="secondary">Google Lensを開く</button></div></div></section>
<section class="card"><div class="sectionTitle"><div class="step">2</div><h2>類似商品の相場</h2></div><div class="grid"><div><label>比較方法</label><select id="match"><option value="1">A 同型・同品番</option><option value="0.85">B 近似型</option><option value="0.7">C 参考品</option></select></div><div><label>送料</label><input id="shipping" type="number" value="750"></div></div><label style="margin-top:12px">売り切れ結果スクショ（複数可）</label><input id="market" type="file" accept="image/*" multiple><button id="marketOcr">スクショを一括解析</button><div id="mStatus" class="status">検索結果を2〜3枚撮り、同型または近似商品の価格だけ残してください。</div><div id="prices"></div><button id="addPrice" class="secondary">価格を追加</button></section>
<section class="card" id="judge"><div class="sectionTitle"><div class="step">3</div><h2>仕入れ判定</h2></div><div id="decision" class="decision stop"><strong>見送り</strong></div><div class="limit"><span>目標利益を確保する仕入上限</span><b id="limit">0円</b><small id="delta">店頭価格を入力してください</small></div><div class="metrics"><div class="metric"><span>安全側想定売価</span><b id="safe">0円</b></div><div class="metric"><span>想定利益</span><b id="profit">0円</b></div><div class="metric"><span>相場中央値</span><b id="median">0円</b></div><div class="metric"><span>利益率</span><b id="margin">0.0%</b></div></div><div id="warnings"></div><div class="actions"><button id="buy">仕入れる</button><button id="pass" class="secondary">見送る</button></div></section>
<section class="card" id="history"><div class="sectionTitle"><div class="step">✓</div><h2>判定履歴</h2></div><div id="historyList"></div><button id="csv" class="secondary">CSV出力</button></section>
<section class="card" id="settings"><div class="sectionTitle"><div class="step">⚙</div><h2>設定</h2></div><div class="grid"><div><label>目標利益</label><input id="target" type="number" value="2000"></div><div><label>最低利益率（%）</label><input id="minMargin" type="number" value="25"></div><div><label>安全率（%）</label><input id="safety" type="number" value="90"></div><div><label>販売手数料（%）</label><input id="feeRate" type="number" value="10"></div></div><p class="hint">仕入上限＝安全側想定売価－手数料－送料－リスク－目標利益。実際の利益は保証されません。</p></section></main><nav class="bottom"><div><button onclick="go('scan')">撮影・検索</button><button onclick="go('judge')">判定</button><button onclick="go('settings')">設定</button></div></nav><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=x=>document.getElementById(x),yen=n=>Math.round(n||0).toLocaleString('ja-JP')+'円';function go(x){$(x).scrollIntoView({behavior:'smooth'})}let theme=localStorage.getItem('theme')||'auto';function setTheme(t){theme=t;document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);$('theme').textContent=t==='auto'?'◐ Auto':t==='dark'?'☾ Dark':'☀ Light'}setTheme(theme);$('theme').onclick=()=>setTheme(theme==='auto'?'dark':theme==='dark'?'light':'auto');let mode='whole';document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('ocrStatus').textContent={whole:'商品全体を撮影。見た目の記録用です。文字があればOCRします。',tag:'ブランドタグを大きく撮影。',model:'型番・品番ラベルを正面から撮影。',price:'値札の価格部分を大きく撮影。'}[mode]});document.querySelector('[data-mode=whole]').click();$('photo').onchange=e=>{let f=e.target.files[0];$('preview').innerHTML='';if(f){let im=new Image;im.src=URL.createObjectURL(f);$('preview').appendChild(im)}};
async function ocrFiles(fs,status){let out=[];for(let[i,f]of[...fs].entries()){let r=await Tesseract.recognize(f,'jpn+eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`解析中 ${i+1}/${fs.length} ${Math.round(m.progress*100)}%`}});out.push(r.data.text)}return out.join('\n')}const brands=['Carhartt','Dickies','Polo Ralph Lauren','Ralph Lauren','adidas','NIKE','Levi\'s','Champion','Patagonia','THE NORTH FACE','L.L.Bean','Columbia','Harley-Davidson','Canon','SONY','Nikon','Panasonic','CASIO','FUJIFILM','OLYMPUS','PENTAX','Nintendo','BOSS','Roland','YAMAHA','KORG','Makita','HiKOKI','BOSCH','BOSE','JBL','DENON','ONKYO','Technics'];const uq=a=>[...new Set(a.filter(Boolean))].slice(0,10);
function buildQueries(){let b=$('brand').value.trim(),n=$('name').value.trim(),m=$('model').value.trim(),q=uq([[b,m].filter(Boolean).join(' '),[b,n,m].filter(Boolean).join(' '),[b,n].filter(Boolean).join(' ')]);$('queries').innerHTML=q.length?q.map(x=>`<div class="query"><code>${x}</code><button onclick="navigator.clipboard.writeText('${x.replaceAll("'","\\'")}')">コピー</button></div>`).join(''):'<p class="hint">ブランド・商品名・型番を入力すると候補が出ます。</p>'}
$('ocr').onclick=async()=>{let fs=$('photo').files;if(!fs.length)return alert('写真を選んでください');let t=await ocrFiles(fs,$('ocrStatus'));$('raw').textContent=t;$('candidates').innerHTML='';let c=[];if(mode==='tag'||mode==='whole')c=brands.filter(b=>new RegExp(b.replace('.','\\.'),'i').test(t));if(mode==='model'){let m=t.toUpperCase().match(/[A-Z]{1,8}[\s_-]?[A-Z0-9]{2,15}(?:[\s_-][A-Z0-9]{1,10})?/g)||[];c=uq(m.filter(x=>!/MADE|SIZE|COLOR|PRICE|JAPAN|CHINA/.test(x)).flatMap(x=>[x,x.replaceAll('O','0'),x.replaceAll('0','O'),x.replaceAll('I','1'),x.replaceAll('1','I')]))}if(mode==='price')c=uq([...t.matchAll(/(?:¥|￥)?\s*([1-9][0-9,]{2,6})\s*(?:円|税込)?/g)].map(m=>m[1].replaceAll(',','')));c.forEach(v=>{let s=document.createElement('span');s.className='candidate';s.textContent=v;s.onclick=()=>{if(mode==='tag'||mode==='whole')$('brand').value=v;if(mode==='model')$('model').value=v;if(mode==='price')$('cost').value=+v;buildQueries();calc()};$('candidates').appendChild(s)});$('ocrStatus').textContent=c.length?'候補をタップして採用してください。':'候補なし。撮り直すか手入力してください。'};['brand','name','model'].forEach(id=>$(id).oninput=buildQueries);$('mercari').onclick=()=>window.open('https://jp.mercari.com/search','_blank');$('lens').onclick=()=>window.open('https://lens.google.com/','_blank');
function addPrice(v='',check=true){let d=document.createElement('div');d.className='priceRow';d.innerHTML=`<input type="checkbox" ${check?'checked':''}><input type="number" value="${v}" placeholder="成約価格"><span></span>`;d.querySelectorAll('input').forEach(x=>x.oninput=calc);$('prices').appendChild(d)}for(let i=0;i<5;i++)addPrice('',false);$('addPrice').onclick=()=>addPrice('',true);$('marketOcr').onclick=async()=>{let fs=$('market').files;if(!fs.length)return alert('スクショを選んでください');let t=await ocrFiles(fs,$('mStatus')),p=uq([...t.matchAll(/(?:¥|￥)?\s*([1-9][0-9,]{2,6})\s*円?/g)].map(m=>+m[1].replaceAll(',','')).filter(n=>n>=300&&n<=500000));$('prices').innerHTML='';(p.length?p:['','','','','']).forEach(v=>addPrice(v,!!v));$('mStatus').textContent=p.length?`${p.length}件を抽出。型番違い、送料、外れ値を外してください。`:'価格を抽出できません。手入力してください。';calc()};function median(a){a=[...a].sort((x,y)=>x-y);let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}function qt(a,q){a=[...a].sort((x,y)=>x-y);let p=(a.length-1)*q,b=Math.floor(p);return a[b]+((a[b+1]??a[b])-a[b])*(p-b)}function mark(){let rs=[...document.querySelectorAll('.priceRow')],a=rs.map(r=>+r.querySelector('input[type=number]').value).filter(Boolean);if(a.length<4)return rs.forEach(r=>{r.classList.remove('outlier');r.querySelector('span').textContent=''});let q1=qt(a,.25),q3=qt(a,.75),iqr=q3-q1;rs.forEach(r=>{let n=+r.querySelector('input[type=number]').value,o=n&&(n<q1-1.5*iqr||n>q3+1.5*iqr);r.classList.toggle('outlier',o);r.querySelector('span').textContent=o?'要確認':''})}let last={};function calc(){mark();let p=[...document.querySelectorAll('.priceRow')].filter(r=>r.querySelector('input[type=checkbox]').checked).map(r=>+r.querySelector('input[type=number]').value).filter(Boolean),med=p.length?median(p):0,w=+$('match').value,safe=med*w*((+$('safety').value||90)/100),fee=safe*((+$('feeRate').value||10)/100),ship=+$('shipping').value||0,cost=+$('cost').value||0,r=$('condition').value,risk=r==='0.4'?safe*.4:+r,target=+$('target').value||0,min=(+$('minMargin').value||25)/100,profit=safe-fee-ship-risk-cost,margin=safe?profit/safe:0,limit=Math.max(0,safe-fee-ship-risk-target),delta=limit-cost,machine=$('category').value!=='服',label=profit>=target&&margin>=min&&p.length>=3?'仕入れ候補':profit>0?'要確認':'見送り';if(machine&&w<1)label='要確認';let cls=label==='仕入れ候補'?'buy':label==='要確認'?'hold':'stop';$('decision').className='decision '+cls;$('decision').innerHTML=`<strong>${label}</strong><br><span class="badge">比較 ${p.length}件</span>`;$('limit').textContent=yen(limit);$('delta').textContent=cost?`店頭 ${yen(cost)} / 上限との差 ${delta>=0?'+':''}${yen(delta)}`:'店頭価格を入力してください';$('safe').textContent=yen(safe);$('profit').textContent=yen(profit);$('median').textContent=yen(med);$('margin').textContent=(margin*100).toFixed(1)+'%';let wns=[];if(p.length<3)wns.push('比較価格が3件未満');if(machine&&w<1)wns.push('機械は同型相場を優先');if(r==='1000')wns.push('動作未確認リスクを適用');$('warnings').innerHTML=wns.map(x=>`<div class="status">${x}</div>`).join('');return last={profit,limit,label}}['category','condition','match','shipping','cost','target','minMargin','safety','feeRate'].forEach(id=>$(id).oninput=calc);const KEY='sourcingV5';function data(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function render(){let d=data();$('historyList').innerHTML=d.length?d.slice(0,30).map(x=>`<div class="history"><div><b>${x.brand||''} ${x.name||'商品'}</b><br><small>${x.model||''} / ${x.action}</small></div><div><b>${yen(x.limit)}</b><br><small>仕入上限</small></div></div>`).join(''):'<p class="hint">まだ履歴がありません。</p>'}function store(a){let r=calc(),d=data();d.unshift({date:new Date().toLocaleString('ja-JP'),brand:$('brand').value,name:$('name').value,model:$('model').value,cost:+$('cost').value,profit:r.profit,limit:r.limit,label:r.label,action:a});localStorage.setItem(KEY,JSON.stringify(d.slice(0,300)));render();alert(a+'として保存しました')}$('buy').onclick=()=>store('仕入れる');$('pass').onclick=()=>store('見送る');$('csv').onclick=()=>{let d=data(),rows=[['日時','ブランド','商品名','型番','仕入額','仕入上限','想定利益','判定','判断'],...d.map(x=>[x.date,x.brand,x.name,x.model,x.cost,Math.round(x.limit),Math.round(x.profit),x.label,x.action])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='仕入れ判定履歴_v5.csv';a.click()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');buildQueries();render();calc();
</script></body></html>
