<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365d"><link rel="manifest" href="manifest.json"><title>仕入れ判定カメラ</title><style>
:root{--navy:#17365d;--blue:#2673b8;--bg:#f4f7fa;--green:#138a4a;--amber:#b36b00;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:var(--bg);color:#17202a}header{background:var(--navy);color:#fff;padding:16px;position:sticky;top:0;z-index:2}header h1{font-size:20px;margin:0}header small{opacity:.85}.wrap{max-width:860px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 12px #17365d18}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}}label{font-weight:700;font-size:13px;display:block;margin-bottom:4px}input,select,button,textarea{width:100%;padding:11px;border:1px solid #bac6d3;border-radius:9px;font-size:16px;background:#fff}button{border:0;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.secondary{background:#526579}.danger{background:#9b2c2c}.row{display:flex;gap:8px}.row>*{flex:1}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.preview img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid #ccd6df}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e6eef6;font-weight:800;margin:3px}.result{font-size:18px}.big{font-size:30px;font-weight:900}.buy{color:var(--green)}.hold{color:var(--amber)}.stop{color:var(--red)}.prices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.prices input{text-align:right}@media(max-width:620px){.prices{grid-template-columns:repeat(2,1fr)}}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #d8e0e8;text-align:left}.hint{font-size:12px;color:#536274}.status{padding:10px;border-left:5px solid #2673b8;background:#edf5fc;margin:8px 0}.hidden{display:none}</style></head><body>
<header><h1>仕入れ判定カメラ</h1><small>服は類似型OK、機械は型番一致を優先</small></header><main class="wrap">
<section class="card"><h2>1. 商品写真</h2><div class="grid"><div><label>商品写真・タグ・型番・値札</label><input id="productFiles" type="file" accept="image/*" capture="environment" multiple></div><div><label>メルカリ売り切れスクショ</label><input id="marketFiles" type="file" accept="image/*" multiple></div></div><div id="preview" class="preview"></div><div class="row" style="margin-top:10px"><button id="ocrBtn">スクショの価格をOCR</button><button class="secondary" id="clearImg">画像を外す</button></div><div id="ocrStatus" class="status hidden"></div><p class="hint">OCRは画像をブラウザ内で処理します。初回のみOCRライブラリの読込に通信が必要です。読み違いは必ず修正してください。</p></section>
<section class="card"><h2>2. 商品情報</h2><div class="grid"><div><label>区分</label><select id="category"><option>服</option><option>ゲーム</option><option>カメラ</option><option>オーディオ</option><option>楽器</option><option>工具</option><option>ホビー</option><option>その他</option></select></div><div><label>状態</label><select id="condition"><option value="0">動作品・中古良好</option><option value="500">傷・使用感あり</option><option value="1000">動作未確認</option><option value="2000">欠品あり</option><option value="0.4">ジャンク（売価の40%を引当）</option></select></div><div><label>ブランド / メーカー</label><input id="brand" placeholder="例：Carhartt / Canon"></div><div><label>商品名</label><input id="name" placeholder="例：ダックジャケット / IXY DIGITAL"></div><div><label>型番・品番</label><input id="model" placeholder="機械は必須、服は分かれば入力"></div><div><label>店頭価格</label><input id="cost" type="number" inputmode="numeric" value="3300"></div></div>
<h3>比較方法</h3><div class="grid"><div><label>一致レベル</label><select id="match"><option value="1">A 同型・同品番（100%）</option><option value="0.85">B 近似型（85%）</option><option value="0.7">C 参考品（70%）</option></select></div><div><label>送料</label><input id="shipping" type="number" inputmode="numeric" value="750"></div></div><p id="matchAdvice" class="hint"></p></section>
<section class="card"><h2>3. 売り切れ価格</h2><p class="hint">OCR結果または手入力。送料込みの成約価格を3〜5件以上入力してください。</p><div class="prices" id="prices"></div><button class="secondary" id="addPrice" style="margin-top:8px">価格欄を追加</button></section>
<section class="card"><h2>4. 判定</h2><div id="result" class="result"></div><button id="saveBtn">この判定を端末に保存</button></section>
<section class="card"><h2>保存履歴</h2><div class="row"><button class="secondary" id="csvBtn">CSVを書き出す</button><button class="danger" id="deleteAll">履歴を全削除</button></div><div style="overflow:auto"><table><thead><tr><th>日時</th><th>商品</th><th>区分</th><th>仕入</th><th>推定利益</th><th>判定</th></tr></thead><tbody id="history"></tbody></table></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id);let imageUrls=[];const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';
function addPrice(v=''){let i=document.createElement('input');i.type='number';i.inputMode='numeric';i.placeholder='売切価格';i.value=v;i.oninput=calc;$('prices').appendChild(i)};for(let i=0;i<5;i++)addPrice();$('addPrice').onclick=()=>addPrice();
function median(a){a=[...a].sort((x,y)=>x-y);let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function vals(){return [...$('prices').querySelectorAll('input')].map(x=>+x.value).filter(x=>x>0)}
function calc(){let p=vals(),cost=+$('cost').value||0,ship=+$('shipping').value||0,weight=+$('match').value,med=p.length?median(p):0;let adjusted=med*weight*.9;let c=$('condition').value,risk=c==='0.4'?adjusted*.4:+c;let fee=adjusted*.1,profit=adjusted-fee-ship-cost-risk,margin=adjusted?profit/adjusted:0,maxCost=adjusted-fee-ship-risk-2000;let machinery=$('category').value!=='服';let confidence=p.length>=5?'高':p.length>=3?'中':'低';let ok=profit>=2000&&margin>=.25&&p.length>=3;let hold=profit>=1000&&p.length>=2;let label=ok?'仕入れ候補':hold?'要確認':'見送り';if(machinery&&+$('match').value<1)label='要確認';let cls=label==='仕入れ候補'?'buy':label==='要確認'?'hold':'stop';$('result').innerHTML=`<div class="big ${cls}">${label}</div><div><span class="badge">信頼度 ${confidence}</span><span class="badge">比較 ${p.length}件</span></div><p>中央値：<b>${yen(med)}</b><br>類似度・安全率反映後：<b>${yen(adjusted)}</b><br>手数料：${yen(fee)} / 送料：${yen(ship)} / リスク引当：${yen(risk)}</p><p>想定利益：<b class="${cls}">${yen(profit)}</b><br>利益率：<b>${(margin*100).toFixed(1)}%</b><br>利益2,000円を残す仕入上限：<b>${yen(Math.max(0,maxCost))}</b></p>${p.length<3?'<div class="status">比較件数が不足。3件以上を推奨。</div>':''}${machinery&&+$('match').value<1?'<div class="status">機械の類似型は参考値です。型番違いで価格が変わるため、同型成約を優先してください。</div>':''}`;return{med,adjusted,profit,margin,label,p}}
['category','condition','match','cost','shipping','brand','name','model'].forEach(id=>$(id).oninput=calc);$('match').onchange=calc;$('category').onchange=()=>{let f=$('category').value==='服';$('matchAdvice').textContent=f?'服：ブランド、アイテム、素材、年代、サイズ、状態が近ければB近似型を使用できます。':'機械：原則A同型。同型が無い場合のみB/Cを参考表示し、最終判定は要確認になります。';calc()};$('category').onchange();
function preview(files){[...files].forEach(f=>{let u=URL.createObjectURL(f);imageUrls.push(u);let im=new Image();im.src=u;$('preview').appendChild(im)})}$('productFiles').onchange=e=>preview(e.target.files);$('marketFiles').onchange=e=>preview(e.target.files);$('clearImg').onclick=()=>{$('preview').innerHTML='';imageUrls.forEach(URL.revokeObjectURL);imageUrls=[];$('productFiles').value=$('marketFiles').value=''};
$('ocrBtn').onclick=async()=>{let fs=[...$('marketFiles').files];if(!fs.length){alert('売り切れスクショを選択してください');return}if(!window.Tesseract){alert('OCRライブラリを読み込めません。通信を確認してください');return}$('ocrStatus').classList.remove('hidden');$('ocrStatus').textContent='OCR処理中…';let all=[];for(let f of fs){let r=await Tesseract.recognize(f,'jpn+eng',{logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent='OCR処理中 '+Math.round(m.progress*100)+'%'}});let text=r.data.text;let matches=[...text.matchAll(/(?:¥|￥)?\s*([1-9][0-9,]{2,6})\s*円?/g)].map(m=>+m[1].replaceAll(',','')).filter(n=>n>=300&&n<=500000);all.push(...matches)}all=[...new Set(all)].slice(0,10);$('prices').innerHTML='';(all.length?all:['','','','','']).forEach(addPrice);$('ocrStatus').textContent=all.length?`${all.length}件の価格候補を抽出。相場でない数字は削除してください。`:'価格を抽出できませんでした。手入力してください。';calc()};
const key='sourcingJudgeHistoryV1';function historyData(){return JSON.parse(localStorage.getItem(key)||'[]')}function render(){let d=historyData();$('history').innerHTML=d.map(x=>`<tr><td>${x.date}</td><td>${x.brand} ${x.name}<br><small>${x.model}</small></td><td>${x.category}</td><td>${yen(x.cost)}</td><td>${yen(x.profit)}</td><td>${x.label}</td></tr>`).join('')}$('saveBtn').onclick=()=>{let r=calc(),d=historyData();d.unshift({date:new Date().toLocaleString('ja-JP'),category:$('category').value,brand:$('brand').value,name:$('name').value,model:$('model').value,cost:+$('cost').value,profit:r.profit,label:r.label,prices:r.p});localStorage.setItem(key,JSON.stringify(d.slice(0,500)));render();alert('端末に保存しました')};$('deleteAll').onclick=()=>{if(confirm('保存履歴を全て削除しますか？')){localStorage.removeItem(key);render()}};$('csvBtn').onclick=()=>{let d=historyData(),rows=[['日時','区分','ブランド','商品名','型番','仕入額','想定利益','判定'],...d.map(x=>[x.date,x.category,x.brand,x.name,x.model,x.cost,Math.round(x.profit),x.label])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='仕入れ判定履歴.csv';a.click()};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();calc();</script></body></html>
