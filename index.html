<!doctype html><html lang="ja" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#28251f"><link rel="manifest" href="manifest.json"><title>仕入れ判定 V6</title><style>
:root{--bg:#f3f0e9;--s:#fffdf8;--s2:#ebe6db;--ink:#28251f;--muted:#716b60;--line:#d9d1c3;--a:#b55332;--o:#6e7b55;--good:#447454;--warn:#aa7428;--bad:#a3473f}html[data-theme=dark]{--bg:#171713;--s:#22211c;--s2:#2e2c25;--ink:#f3efe5;--muted:#aaa396;--line:#434036;--a:#e07b54;--o:#9cab78;--good:#74ad84;--warn:#d5a14e;--bad:#d8756c}@media(prefers-color-scheme:dark){html[data-theme=auto]{--bg:#171713;--s:#22211c;--s2:#2e2c25;--ink:#f3efe5;--muted:#aaa396;--line:#434036;--a:#e07b54;--o:#9cab78;--good:#74ad84;--warn:#d5a14e;--bad:#d8756c}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;padding-bottom:74px}header{background:var(--s);border-bottom:1px solid var(--line);padding:15px;position:sticky;top:0;z-index:5}.head{max-width:840px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--a),#db9b65);display:grid;place-items:center;color:#fff;font-weight:950}h1{font-size:19px;margin:0}.theme{width:auto;background:var(--s2);color:var(--ink)}main{max-width:840px;margin:auto;padding:12px}.card{background:var(--s);border:1px solid var(--line);border-radius:21px;padding:16px;margin:12px 0}.title{display:flex;gap:9px;align-items:center;margin-bottom:12px}.step{width:29px;height:29px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font-weight:900}.title h2{font-size:17px;margin:0}label{display:block;color:var(--muted);font-size:12px;font-weight:850;margin:4px 0}input,select,button{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--s);color:var(--ink);font-size:16px}button{border:0;background:var(--a);color:#fff;font-weight:850}.secondary{background:var(--s2);color:var(--ink)}.olive{background:var(--o)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}@media(max-width:620px){.grid{grid-template-columns:1fr}}.preview img{width:100%;max-height:260px;object-fit:contain;border-radius:14px;background:var(--s2);margin-top:9px}.status{background:var(--s2);border-left:4px solid var(--o);border-radius:9px;padding:10px;margin:8px 0;white-space:pre-wrap;font-size:13px}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:600px){.results{grid-template-columns:1fr}}.result{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--s)}.result.selected{border-color:var(--o);box-shadow:0 0 0 3px color-mix(in srgb,var(--o) 20%,transparent)}.result img{width:100%;height:190px;object-fit:contain;background:#eee}.rp{padding:11px}.rp h3{font-size:15px;margin:0 0 7px}.rp p{font-size:12px;color:var(--muted);margin:4px 0}.rp button{margin-top:8px}.selectedBox{background:color-mix(in srgb,var(--o) 12%,var(--s));border:1px solid var(--o);border-radius:15px;padding:12px;margin-top:10px}.prices .row{display:grid;grid-template-columns:28px 1fr 84px;gap:7px;align-items:center;background:var(--s2);padding:7px;border-radius:10px;margin:6px 0}.prices input[type=checkbox]{width:21px}.decision{text-align:center;padding:17px;border-radius:18px}.buy{background:color-mix(in srgb,var(--good) 17%,var(--s));color:var(--good)}.hold{background:color-mix(in srgb,var(--warn) 17%,var(--s));color:var(--warn)}.stop{background:color-mix(in srgb,var(--bad) 15%,var(--s));color:var(--bad)}.limit{background:var(--ink);color:var(--bg);padding:20px;text-align:center;border-radius:20px;margin:10px 0}.limit b{display:block;font-size:45px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:var(--s2);padding:11px;border-radius:12px}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{font-size:18px}.hint{font-size:12px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--s);border-top:1px solid var(--line);z-index:8}.bottom div{max-width:840px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.bottom button{background:transparent;color:var(--muted);font-size:12px;border-radius:0}</style></head><body><header><div class="head"><div class="brand"><div class="mark">S</div><div><h1>仕入れ判定 V6</h1><small>Visual Search Edition</small></div></div><button id="theme" class="theme">◐ Auto</button></div></header><main>
<section class="card" id="search"><div class="title"><div class="step">1</div><h2>商品写真から類似商品を探す</h2></div><input id="product" type="file" accept="image/*" capture="environment"><div id="preview" class="preview"></div><button id="searchBtn" class="olive">類似商品を検索</button><div id="searchStatus" class="status">商品全体が写る写真を選んでください。500KB以下に自動圧縮します。</div><div id="results" class="results"></div><div id="selectedBox"></div></section>
<section class="card"><div class="title"><div class="step">2</div><h2>選択した商品情報を確認</h2></div><div class="grid"><div><label>区分</label><select id="category"><option>服</option><option>ゲーム</option><option>カメラ</option><option>オーディオ</option><option>楽器</option><option>工具</option><option>ホビー</option><option>その他</option></select></div><div><label>商品名・検索ワード</label><input id="name"></div><div><label>ブランド / メーカー</label><input id="brand"></div><div><label>型番・品番</label><input id="model"></div><div><label>店頭価格</label><input id="cost" type="number"></div><div><label>状態</label><select id="condition"><option value="0">良好・動作品</option><option value="500">傷・使用感あり</option><option value="1000">動作未確認</option><option value="2000">欠品あり</option><option value="0.4">ジャンク</option></select></div></div><button id="copy" class="secondary">検索ワードをコピー</button><button id="mercari" class="olive">メルカリ検索を開く</button><p class="hint">選択したWeb候補のタイトルは参考です。型番やブランドは現物と照合してください。</p></section>
<section class="card"><div class="title"><div class="step">3</div><h2>メルカリ売り切れ相場</h2></div><div class="grid"><div><label>比較方法</label><select id="match"><option value="1">A 同型・同品番</option><option value="0.85">B 近似型</option><option value="0.7">C 参考品</option></select></div><div><label>送料</label><input id="shipping" type="number" value="750"></div></div><label>売り切れ結果スクショ（複数可）</label><input id="market" type="file" accept="image/*" multiple><button id="marketOcr">スクショから価格を抽出</button><div id="mStatus" class="status">検索結果を2〜3枚撮り、同型・近似商品の価格だけ残してください。</div><div id="prices" class="prices"></div><button id="addPrice" class="secondary">手入力で価格追加</button></section>
<section class="card" id="judge"><div class="title"><div class="step">4</div><h2>仕入れ判定</h2></div><div id="decision" class="decision stop"><b>見送り</b></div><div class="limit"><span>目標利益を確保する仕入上限</span><b id="limit">0円</b><small id="delta">店頭価格を入力してください</small></div><div class="metrics"><div class="metric"><span>安全側想定売価</span><b id="safe">0円</b></div><div class="metric"><span>想定利益</span><b id="profit">0円</b></div><div class="metric"><span>相場中央値</span><b id="median">0円</b></div><div class="metric"><span>利益率</span><b id="margin">0.0%</b></div></div><div id="warnings"></div></section>
<section class="card" id="settings"><div class="title"><div class="step">⚙</div><h2>設定</h2></div><div class="grid"><div><label>目標利益</label><input id="target" type="number" value="2000"></div><div><label>最低利益率 %</label><input id="minMargin" type="number" value="25"></div><div><label>安全率 %</label><input id="safety" type="number" value="90"></div><div><label>販売手数料 %</label><input id="feeRate" type="number" value="10"></div></div></section></main><nav class="bottom"><div><button onclick="go('search')">画像検索</button><button onclick="go('judge')">判定</button><button onclick="go('settings')">設定</button></div></nav><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const API='https://sekastock-image-search.masato369567.workers.dev/';const $=x=>document.getElementById(x),yen=n=>Math.round(n||0).toLocaleString('ja-JP')+'円';function go(x){$(x).scrollIntoView({behavior:'smooth'})}let theme=localStorage.getItem('theme')||'auto';function setTheme(t){theme=t;document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);$('theme').textContent=t==='auto'?'◐ Auto':t==='dark'?'☾ Dark':'☀ Light'}setTheme(theme);$('theme').onclick=()=>setTheme(theme==='auto'?'dark':theme==='dark'?'light':'auto');$('product').onchange=e=>{let f=e.target.files[0];$('preview').innerHTML='';if(f){let i=new Image;i.src=URL.createObjectURL(f);$('preview').appendChild(i)}};async function compress(f){if(f.size<=480000)return f;let i=await new Promise((ok,no)=>{let x=new Image;x.onload=()=>ok(x);x.onerror=no;x.src=URL.createObjectURL(f)}),sc=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*sc);c.height=Math.round(i.height*sc);c.getContext('2d').drawImage(i,0,0,c.width,c.height);let q=.75,b;do{b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',q));q-=.1}while(b.size>480000&&q>.25);return new File([b],'product.jpg',{type:'image/jpeg'})}
$('searchBtn').onclick=async()=>{let f=$('product').files[0];if(!f)return alert('商品写真を選択してください');$('searchBtn').disabled=true;$('results').innerHTML='';$('selectedBox').innerHTML='';$('searchStatus').textContent='画像を準備中…';try{f=await compress(f);let fd=new FormData();fd.append('image',f,f.name);$('searchStatus').textContent='Web上の類似商品を検索中…';let res=await fetch(API,{method:'POST',body:fd}),d=await res.json();if(!res.ok||!d.ok)throw new Error(JSON.stringify(d));$('searchStatus').textContent=`${d.count}件の候補を取得。現物に一番近いものを選んでください。`;for(const m of d.matches||[]){let c=document.createElement('article');c.className='result';let im=m.thumbnail||m.image||'';c.innerHTML=`${im?`<img src="${im}" alt="類似商品">`:''}<div class="rp"><h3>${esc(m.title||'タイトルなし')}</h3><p>${esc(m.source||'')}</p>${m.link?`<a href="${m.link}" target="_blank" rel="noopener">元ページを確認</a>`:''}<button>これに近い</button></div>`;c.querySelector('button').onclick=()=>selectMatch(c,m);$('results').appendChild(c)}}catch(e){$('searchStatus').textContent='エラー\n'+e.message}finally{$('searchBtn').disabled=false}};function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function selectMatch(card,m){document.querySelectorAll('.result').forEach(x=>x.classList.remove('selected'));card.classList.add('selected');$('name').value=m.title||'';$('selectedBox').innerHTML=`<div class="selectedBox"><b>選択済み</b><p>${esc(m.title||'')}</p><small>${esc(m.source||'')}</small></div>`;$('match').value=.85;calc();document.querySelector('section.card:nth-of-type(2)').scrollIntoView({behavior:'smooth'})}
$('copy').onclick=async()=>{await navigator.clipboard.writeText([$ ('brand').value,$('name').value,$('model').value].filter(Boolean).join(' '));alert('検索ワードをコピーしました')};$('mercari').onclick=()=>window.open('https://jp.mercari.com/search','_blank');async function ocr(fs,status){let out=[];for(let[i,f]of[...fs].entries()){let r=await Tesseract.recognize(f,'jpn+eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`OCR中 ${i+1}/${fs.length} ${Math.round(m.progress*100)}%`}});out.push(r.data.text)}return out.join('\n')}function addPrice(v='',ck=true){let r=document.createElement('div');r.className='row';r.innerHTML=`<input type="checkbox" ${ck?'checked':''}><input type="number" value="${v}" placeholder="成約価格"><span></span>`;r.querySelectorAll('input').forEach(x=>x.oninput=calc);$('prices').appendChild(r)}for(let i=0;i<5;i++)addPrice('',false);$('addPrice').onclick=()=>addPrice('',true);$('marketOcr').onclick=async()=>{let fs=$('market').files;if(!fs.length)return alert('スクショを選択してください');let t=await ocr(fs,$('mStatus')),p=[...new Set([...t.matchAll(/(?:¥|￥)?\s*([1-9][0-9,]{2,6})\s*円?/g)].map(m=>+m[1].replaceAll(',','')).filter(n=>n>=300&&n<=500000))].slice(0,12);$('prices').innerHTML='';(p.length?p:['','','','','']).forEach(v=>addPrice(v,!!v));$('mStatus').textContent=p.length?`${p.length}件抽出。比較対象外の価格はチェックを外してください。`:'抽出できません。手入力してください。';calc()};function med(a){a=[...a].sort((x,y)=>x-y);let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}function calc(){let p=[...document.querySelectorAll('.prices .row')].filter(r=>r.querySelector('input[type=checkbox]').checked).map(r=>+r.querySelector('input[type=number]').value).filter(Boolean),m=p.length?med(p):0,w=+$('match').value,safe=m*w*((+$('safety').value||90)/100),fee=safe*((+$('feeRate').value||10)/100),ship=+$('shipping').value||0,cost=+$('cost').value||0,r=$('condition').value,risk=r==='0.4'?safe*.4:+r,target=+$('target').value||0,min=(+$('minMargin').value||25)/100,profit=safe-fee-ship-risk-cost,margin=safe?profit/safe:0,limit=Math.max(0,safe-fee-ship-risk-target),delta=limit-cost,machine=$('category').value!=='服',label=profit>=target&&margin>=min&&p.length>=3?'仕入れ候補':profit>0?'要確認':'見送り';if(machine&&w<1)label='要確認';let cls=label==='仕入れ候補'?'buy':label==='要確認'?'hold':'stop';$('decision').className='decision '+cls;$('decision').innerHTML=`<b>${label}</b>`;$('limit').textContent=yen(limit);$('delta').textContent=cost?`店頭 ${yen(cost)} / 上限との差 ${delta>=0?'+':''}${yen(delta)}`:'店頭価格を入力してください';$('safe').textContent=yen(safe);$('profit').textContent=yen(profit);$('median').textContent=yen(m);$('margin').textContent=(margin*100).toFixed(1)+'%';let a=[];if(!$('name').value)a.push('類似商品が未選択');if(p.length<3)a.push('比較価格が3件未満');if(machine&&w<1)a.push('機械の近似型は参考値');$('warnings').innerHTML=a.map(x=>`<div class="status">${x}</div>`).join('')}['category','match','shipping','condition','cost','target','minMargin','safety','feeRate'].forEach(id=>$(id).oninput=calc);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');calc();
</script></body></html>
