<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365d"><link rel="manifest" href="manifest.json"><title>仕入れ判定カメラ</title><style>
:root{--n:#17365d;--b:#2673b8;--bg:#f4f7fa;--g:#138a4a;--a:#b36b00;--r:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:var(--bg);color:#17202a}header{background:var(--n);color:white;padding:15px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:20px}.wrap{max-width:850px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 12px #17365d18}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:800;font-size:13px;margin:5px 0}input,select,button,textarea{width:100%;padding:11px;border:1px solid #bcc8d4;border-radius:9px;font-size:16px}button{background:var(--b);color:#fff;border:0;font-weight:800;margin-top:7px}.secondary{background:#53677a}.danger{background:#9b2c2c}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.preview img{width:100%;height:110px;object-fit:cover;border:1px solid #ccd6df;border-radius:8px}.status{margin-top:8px;padding:10px;background:#edf5fc;border-left:5px solid var(--b);white-space:pre-wrap}.warn{background:#fff4de;border-left-color:var(--a)}.prices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}@media(max-width:620px){.prices{grid-template-columns:1fr 1fr}}.big{font-size:30px;font-weight:900}.buy{color:var(--g)}.hold{color:var(--a)}.stop{color:var(--r)}.badge{display:inline-block;background:#e6eef6;padding:5px 8px;border-radius:999px;font-weight:800;margin:2px}.raw{font-size:12px;max-height:140px;overflow:auto;background:#f6f7f8;padding:8px;border-radius:7px;white-space:pre-wrap}.hint{font-size:12px;color:#536274}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><header><h1>仕入れ判定カメラ v2</h1><small>商品OCR → 相場OCR → 利益判定</small></header><main class="wrap">
<section class="card"><h2>1. 商品を撮影</h2><label>商品・タグ・型番・値札（複数枚OK）</label><input id="productFiles" type="file" accept="image/*" capture="environment" multiple><div id="pPrev" class="preview"></div><button id="productOcr">タグ・型番・値札をOCR</button><div id="pStatus" class="status">商品写真を選び、OCRを押してください。</div><details><summary>OCR全文を確認</summary><div id="rawProduct" class="raw"></div></details></section>
<section class="card"><h2>2. 商品情報を確認</h2><div class="grid"><div><label>区分</label><select id="category"><option>服</option><option>ゲーム</option><option>カメラ</option><option>オーディオ</option><option>楽器</option><option>工具</option><option>ホビー</option><option>その他</option></select></div><div><label>状態</label><select id="condition"><option value="0">動作品・中古良好</option><option value="500">傷・使用感あり</option><option value="1000">動作未確認</option><option value="2000">欠品あり</option><option value="0.4">ジャンク</option></select></div><div><label>ブランド / メーカー</label><input id="brand" placeholder="OCR候補を自動入力"></div><div><label>商品名</label><input id="name" placeholder="例：ダックジャケット / IXY DIGITAL"></div><div><label>型番・品番</label><input id="model" placeholder="OCR候補を自動入力"></div><div><label>店頭価格</label><input id="cost" type="number" inputmode="numeric"></div><div><label>比較方法</label><select id="match"><option value="1">A 同型・同品番 100%</option><option value="0.85">B 近似型 85%</option><option value="0.7">C 参考品 70%</option></select></div><div><label>送料</label><input id="shipping" type="number" value="750"></div></div><p class="hint">OCRは候補抽出です。ブランド・型番・価格は必ずタグと見比べて修正してください。</p></section>
<section class="card"><h2>3. メルカリ売り切れスクショ</h2><input id="marketFiles" type="file" accept="image/*" multiple><div id="mPrev" class="preview"></div><button id="marketOcr">売り切れ価格をOCR</button><div id="mStatus" class="status">3〜5件以上の同型/類似商品の成約価格を使います。</div><div id="prices" class="prices"></div><button class="secondary" id="addPrice">価格欄を追加</button></section>
<section class="card"><h2>4. 判定</h2><div id="result"></div><button id="save">端末に保存</button></section>
<section class="card"><h2>履歴</h2><button class="secondary" id="csv">CSV出力</button><div style="overflow:auto"><table><thead><tr><th>日時</th><th>商品</th><th>仕入</th><th>利益</th><th>判定</th></tr></thead><tbody id="hist"></tbody></table></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=x=>document.getElementById(x),yen=n=>Math.round(n||0).toLocaleString('ja-JP')+'円';
function previews(input,target){$(target).innerHTML='';[...input.files].forEach(f=>{let i=new Image;i.src=URL.createObjectURL(f);$(target).appendChild(i)})}$('productFiles').onchange=e=>previews(e.target,'pPrev');$('marketFiles').onchange=e=>previews(e.target,'mPrev');
async function ocrFiles(files,status){let texts=[];for(let [i,f] of [...files].entries()){status.textContent=`OCR中 ${i+1}/${files.length}`;let r=await Tesseract.recognize(f,'jpn+eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`OCR中 ${i+1}/${files.length} ${Math.round(m.progress*100)}%`}});texts.push(r.data.text)}return texts.join('\n')}
const brands=['Carhartt','Dickies','Polo Ralph Lauren','Ralph Lauren','adidas','NIKE','Levi’s','Levis','Levi\'s','Champion','Patagonia','THE NORTH FACE','L.L.Bean','Columbia','Harley-Davidson','Canon','SONY','Nikon','Panasonic','CASIO','FUJIFILM','OLYMPUS','PENTAX','Nintendo','BOSS','Roland','YAMAHA','KORG','Makita','HiKOKI','BOSCH','BOSE','JBL','DENON','ONKYO','Technics'];
function parseProduct(t){let clean=t.replace(/\s+/g,' '),brand=brands.find(b=>new RegExp(b.replace('.','\\.'),'i').test(clean))||'';let prices=[...clean.matchAll(/(?:¥|￥)?\s*([1-9][0-9,]{2,6})\s*(?:円|税込)?/g)].map(m=>+m[1].replaceAll(',','')).filter(n=>n>=100&&n<=500000);let price=prices.length?Math.min(...prices):'';let patterns=[/[A-Z]{1,6}[-_ ]?[A-Z0-9]{2,12}(?:[-_][A-Z0-9]{1,8})?/g,/\b(?:DSC|DMC|PCH|PSP|NW|SL|BL|DC|EZ|W)[-_]?[A-Z0-9-]{2,15}\b/gi];let ms=[];patterns.forEach(p=>ms.push(...(clean.match(p)||[])));ms=ms.filter(x=>!/MADE|SIZE|COLOR|PRICE|JAPAN/i.test(x));let model=ms.sort((a,b)=>b.length-a.length)[0]||'';return{brand,price,model}}
$('productOcr').onclick=async()=>{let fs=$('productFiles').files;if(!fs.length)return alert('商品写真を選んでください');if(!window.Tesseract)return alert('OCRライブラリを読み込めません');let t=await ocrFiles(fs,$('pStatus'));$('rawProduct').textContent=t;let x=parseProduct(t);if(x.brand)$('brand').value=x.brand;if(x.model)$('model').value=x.model;if(x.price)$('cost').value=x.price;$('pStatus').textContent=`候補抽出完了\nブランド: ${x.brand||'未確認'}\n型番/品番: ${x.model||'未確認'}\n価格: ${x.price?yen(x.price):'未確認'}\n※誤認識があり得るためタグと照合してください。`;calc()};
function addPrice(v=''){let i=document.createElement('input');i.type='number';i.placeholder='売切価格';i.value=v;i.oninput=calc;$('prices').appendChild(i)}for(let i=0;i<5;i++)addPrice();$('addPrice').onclick=()=>addPrice();
$('marketOcr').onclick=async()=>{let fs=$('marketFiles').files;if(!fs.length)return alert('売り切れスクショを選んでください');let t=await ocrFiles(fs,$('mStatus'));let p=[...t.matchAll(/(?:¥|￥)?\s*([1-9][0-9,]{2,6})\s*円?/g)].map(m=>+m[1].replaceAll(',','')).filter(n=>n>=300&&n<=500000);p=[...new Set(p)].slice(0,12);$('prices').innerHTML='';(p.length?p:['','','','','']).forEach(addPrice);$('mStatus').textContent=p.length?`${p.length}件の価格候補を抽出。相場以外の数字は削除してください。`:'価格を抽出できません。手入力してください。';calc()};
function median(a){a=[...a].sort((x,y)=>x-y);let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}function priceVals(){return [...$('prices').querySelectorAll('input')].map(x=>+x.value).filter(x=>x>0)}
function calc(){let p=priceVals(),med=p.length?median(p):0,w=+$('match').value,cost=+$('cost').value||0,ship=+$('shipping').value||0,safe=med*w*.9,fee=safe*.1,r=$('condition').value,risk=r==='0.4'?safe*.4:+r,profit=safe-fee-ship-risk-cost,margin=safe?profit/safe:0,machine=$('category').value!=='服';let label=(profit>=2000&&margin>=.25&&p.length>=3)?'仕入れ候補':(profit>=1000&&p.length>=2)?'要確認':'見送り';if(machine&&w<1)label='要確認';let cls=label==='仕入れ候補'?'buy':label==='要確認'?'hold':'stop';$('result').innerHTML=`<div class="big ${cls}">${label}</div><span class="badge">比較${p.length}件</span><span class="badge">${$('match').selectedOptions[0].text}</span><p>中央値 <b>${yen(med)}</b><br>安全補正後 <b>${yen(safe)}</b><br>仕入 ${yen(cost)} / 手数料 ${yen(fee)} / 送料 ${yen(ship)} / リスク ${yen(risk)}</p><p>想定利益 <b class="${cls}">${yen(profit)}</b><br>利益率 <b>${(margin*100).toFixed(1)}%</b></p>${machine&&w<1?'<div class="status warn">機械の類似型は参考値。型番一致を優先してください。</div>':''}`;return{profit,label,p}}
['category','condition','match','cost','shipping'].forEach(x=>$(x).oninput=calc);const KEY='sourcingV2';function hist(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function render(){ $('hist').innerHTML=hist().map(x=>`<tr><td>${x.date}</td><td>${x.brand} ${x.name}<br>${x.model}</td><td>${yen(x.cost)}</td><td>${yen(x.profit)}</td><td>${x.label}</td></tr>`).join('')}$('save').onclick=()=>{let r=calc(),d=hist();d.unshift({date:new Date().toLocaleString('ja-JP'),brand:$('brand').value,name:$('name').value,model:$('model').value,cost:+$('cost').value,profit:r.profit,label:r.label});localStorage.setItem(KEY,JSON.stringify(d));render();alert('保存しました')};$('csv').onclick=()=>{let d=hist(),rows=[['日時','ブランド','商品名','型番','仕入額','想定利益','判定'],...d.map(x=>[x.date,x.brand,x.name,x.model,x.cost,Math.round(x.profit),x.label])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='仕入れ判定履歴.csv';a.click()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();calc();
</script></body></html>
